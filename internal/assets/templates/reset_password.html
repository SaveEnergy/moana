{{define "reset_password.html"}}
<!DOCTYPE html>
<html lang="en" class="login-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Moana</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-split">
    <div class="login-panel">
      <div class="login-panel-inner">
        <div class="login-brand">
          <a href="{{.LoginPath}}" class="login-foot-link" style="font-size:0.8125rem">← Back to sign in</a>
        </div>

        <h1 class="login-title">Choose a new password</h1>

        {{if .Error}}
        <p class="alert alert-error login-alert" role="alert">{{.Error}}</p>
        {{end}}

        {{if .Token}}
        <form class="login-form" method="post" action="{{.ResetPasswordPath}}">
          <input type="hidden" name="token" value="{{.Token}}">
          <div class="float-field">
            <label class="float-label" for="reset-password">New password</label>
            <input id="reset-password" class="float-input" type="password" name="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
          </div>
          <div class="float-field">
            <label class="float-label" for="reset-confirm">Confirm password</label>
            <input id="reset-confirm" class="float-input" type="password" name="password_confirm" required autocomplete="new-password" minlength="8" placeholder="Repeat password">
          </div>
          <button type="submit" class="btn btn-primary btn-block login-submit">Update password</button>
        </form>
        {{end}}

        <p class="login-foot muted small">
          Moana © {{.Year}}
          <span aria-hidden="true"> · </span>
          <a class="login-foot-link" href="https://opensource.org/licenses/MIT" rel="license noopener noreferrer" target="_blank">MIT License</a>
          <span aria-hidden="true"> · </span>
          <a class="login-foot-link" href="{{.RepoURL}}" rel="noopener noreferrer" target="_blank">GitHub</a>
        </p>
      </div>
    </div>
    <div class="login-hero" aria-hidden="true">
      <img
        class="login-hero-img"
        src="/static/img/jakub-zerdzicki-4rTXOMv28VA-unsplash.jpg"
        alt=""
        width="1920"
        height="1280"
        fetchpriority="high"
        decoding="async">
    </div>
  </div>
</body>
</html>
{{end}}
